name: Update market data

on:
  schedule:
    # --- 8:30am ET: first run of the day. Does three jobs at once: the daily
    # health-score refresh, an intraday fetch, and the first pre-market gap check.
    # KEEP THIS EXACT STRING - the "Determine health-check run" step below matches
    # "30 8 * * 1-5" literally. It must stay a SEPARATE cron entry: GitHub reports
    # the whole cron expression as github.event.schedule, so if 8:30 were folded into
    # the 10-min block every run in that block would look identical and the health
    # check would fire 7 times a morning instead of once.
    - cron: "30 8 * * 1-5"
      timezone: "America/New_York"
    # --- Rest of pre-market: 8:40, 8:50
    - cron: "40,50 8 * * 1-5"
      timezone: "America/New_York"
    # --- 9:00am to 3:50pm ET every 10 min (42 runs). 9:00-9:20 finish the pre-market
    # window, 9:30 is the open, 3:50 is the last snapshot before the 4:00 close.
    - cron: "0,10,20,30,40,50 9-15 * * 1-5"
      timezone: "America/New_York"
    # --- EOD: 4:30pm ET after the close settles. KEEP THIS EXACT STRING -
    # the "Determine fetch mode" step matches "30 16 * * 1-5" literally to select eod mode.
    - cron: "30 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "Fetch mode for externally-dispatched runs (the Cloudflare dispatcher passes this explicitly, since github.event.schedule is always empty on workflow_dispatch)"
        required: false
        default: "eod"
        type: choice
        options:
          - eod
          - intraday
  push:
    paths:
      - "tickers.txt"

permissions:
  contents: write
  actions: write   # needed to dispatch pages.yml after a successful data commit

concurrency:
  group: update-market-data
  cancel-in-progress: false   # if a run is still going when the next trigger fires, the
                              # new one waits instead of racing it to git push. Only one
                              # run can be pending at a time (GitHub default) - if a third
                              # trigger fires before the first two finish, the older pending
                              # run is dropped and replaced by the newest. That's fine here:
                              # skipping a stale 10-min-old fetch to catch up to "now" is the
                              # right behavior, not a bug.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # EOD + health-score runs can take ~7 min; 8 left only ~1 min of headroom.
                         # Overlap is not a risk: the concurrency block makes new runs wait, not race.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas requests
      - name: Determine fetch mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            # Externally dispatched (Cloudflare cron dispatcher, or a manual
            # UI run) - trust the explicit input rather than guessing from
            # github.event.schedule, which is always empty on workflow_dispatch.
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 16 * * 1-5" ]; then
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          elif [ -z "${{ github.event.schedule }}" ]; then
            echo "mode=eod" >> "$GITHUB_OUTPUT"
          else
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine health-check run
        id: healthcheck
        run: |
          # Health scores (Equity Lens) run on their OWN once-daily
          # schedule, deliberately separate from FETCH_MODE. They fire on
          # the 8:30am ET cron (moved from 4am) - still an hour before the
          # open, so scores are fresh for the trading day. Also fires on a manual eod-mode dispatch,
          # so testing this doesn't require waiting for 4am ET.
          if [ "${{ github.event.schedule }}" = "30 8 * * 1-5" ] || [ "${{ github.event.inputs.mode }}" = "eod" ]; then
            echo "healthcheck=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthcheck=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch market data
        env:
          FETCH_MODE: ${{ steps.mode.outputs.mode }}
          HEALTH_CHECK_RUN: ${{ steps.healthcheck.outputs.healthcheck }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/fetch_data.py
      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # docs/data.json, docs/alert_state.json, and
          # docs/health_score_state.json are written with no
          # indentation (single-line JSON) - fast, but it means two runs
          # touching the same file produce a real content conflict on that
          # one line, which git cannot auto-merge no matter how many times
          # a pull-rebase is retried (confirmed: retrying an unresolved
          # rebase just repeats the identical failure, since the conflict
          # from attempt 1 is never cleaned up before attempt 2).
          #
          # The correct fix is to never attempt a merge on these two paths
          # at all: they are 100% machine-regenerated every run, so there
          # is no legitimate "partial old + partial new" version worth
          # preserving - whichever run finishes last should simply win
          # outright. Each retry resets to the latest remote tip and
          # re-applies OUR already-computed files on top, which is always
          # a clean fast-forward, never a content merge.
          # Save the freshly-fetched output BEFORE any git manipulation.
          # git reset --hard overwrites tracked files' working-tree content
          # back to whatever origin has - confirmed directly, not assumed:
          # a reset silently discards uncommitted fresh content and leaves
          # the stale committed version in place. Each retry below must
          # restore the fresh copy after every reset, not just once, or a
          # retry would succeed while quietly throwing away real data.
          cp docs/data.json /tmp/fresh_data.json
          cp docs/alert_state.json /tmp/fresh_alert_state.json
          [ -f docs/health_score_state.json ] && cp docs/health_score_state.json /tmp/fresh_health_score_state.json || true

          pushed=false
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/fresh_data.json docs/data.json
            cp /tmp/fresh_alert_state.json docs/alert_state.json
            [ -f /tmp/fresh_health_score_state.json ] && cp /tmp/fresh_health_score_state.json docs/health_score_state.json || true
            git add docs/data.json docs/alert_state.json
            [ -f docs/health_score_state.json ] && git add docs/health_score_state.json || true
            if git diff --staged --quiet; then
              echo "No changes to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              pushed=true
              break
            fi
            git commit -q -m "Update market data [skip ci]"
            if git push -q; then
              pushed=true
              echo "changed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Push attempt $i failed (remote moved again), retrying..."
            sleep 3
          done
          if [ "$pushed" = false ]; then
            echo "::error::Failed to push after 5 attempts - remote kept moving faster than 5 retries could catch up"
            exit 1
          fi
      - name: Trigger Pages deploy
        # GITHUB_TOKEN-authenticated pushes don't fire other workflows' `push`
        # triggers (GitHub's anti-recursion rule) - workflow_dispatch is exempt
        # from that rule, so we dispatch pages.yml explicitly instead of relying
        # on it noticing the push. Only fires when data.json actually changed,
        # not on every 10-min tick that found nothing new.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
