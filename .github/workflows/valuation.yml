name: Valuation vs own history

# Display-only: refreshes docs/valuation.json, which feeds the "Valuation vs own history" column
# in the Performance overview table. Never touches data.json, the panels, TAKE or the forward log.
#
# Reads each company's SEC filings and 12 years of month-end prices, so one run takes several
# minutes. The underlying figures only change when a company files, so once a week is plenty.
#
# Needs a repository secret named SEC_CONTACT_EMAIL (the SEC requires automated users to give a
# contact address). Without it the run exits cleanly and changes nothing.
on:
  schedule:
    - cron: "37 9 * * 6"    # Saturdays 09:37 UTC, after the US week has closed
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch pages.yml after a commit

concurrency:
  group: valuation
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas
      - name: Compute valuations
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python scripts/valuation_model.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f docs/valuation.json ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          cp docs/valuation.json /tmp/valuation.json
          pushed=false
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/valuation.json docs/valuation.json
            git add docs/valuation.json
            if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; pushed=true; break; fi
            git commit -q -m "Valuation update [skip ci]"
            if git push -q; then pushed=true; echo "changed=true" >> "$GITHUB_OUTPUT"; break; fi
            echo "Push attempt $i failed, retrying..."; sleep 3
          done
          [ "$pushed" = true ] || { echo "::error::Failed to push valuation.json"; exit 1; }
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
