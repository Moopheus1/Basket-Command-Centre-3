name: Premarket snapshot

# Display-only: refreshes docs/premarket.json for the BCC3 Premarket page (docs/premarket.html).
# Pulls Yahoo 1-minute bars including pre-market for every ticker in tickers.txt. Never touches
# data.json, the panels, TAKE, Weekly Picks or the forward log.
#
# Runs every 10 minutes from 4:00am to 9:50am ET on weekdays (pre-market, then the open).
# GitHub's own scheduler can run late or skip runs; if you use an external dispatcher for the
# other workflows, add this one (workflow_dispatch) to it for reliable timing.
on:
  schedule:
    - cron: "*/5 4-9 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch pages.yml after a commit

concurrency:
  group: premarket
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas
      - name: Snapshot
        run: python scripts/premarket_snapshot.py
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f docs/premarket.json ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          cp docs/premarket.json /tmp/premarket.json
          pushed=false
          for i in 1 2 3 4 5; do
            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/premarket.json docs/premarket.json
            git add docs/premarket.json
            if git diff --staged --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; pushed=true; break; fi
            git commit -q -m "Premarket snapshot [skip ci]"
            if git push -q; then pushed=true; echo "changed=true" >> "$GITHUB_OUTPUT"; break; fi
            echo "Push attempt $i failed, retrying..."; sleep 3
          done
          [ "$pushed" = true ] || { echo "::error::Failed to push premarket.json"; exit 1; }
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml
