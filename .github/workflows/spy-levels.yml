name: SPY levels ping

# 21:00 Singapore time (13:00 UTC) Monday-Friday: posts yesterday's SPY high/low (PDH / PDL) to Discord.
# Display-only: reads docs/data.json, writes nothing, commits nothing. Reuses the DISCORD_WEBHOOK_URL secret.
# GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Post SPY PDH / PDL to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/spy_levels_ping.py
